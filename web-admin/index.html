<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Jetcargo</title>
    <!-- Тема и масштаб — до первой отрисовки: без белой вспышки у тех, кто выбрал тёмную тему. -->
    <script>
      try {
        var t = localStorage.getItem("rb_theme");
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
        var s = parseFloat(localStorage.getItem("rb_scale") || "");
        if (s) document.documentElement.style.zoom = String(s);
      } catch (e) {}
    </script>
    <!--
      Заставка при открытии сайта — монохром, как вся панель: плитка со знаком Jetcargo (знак по кругу
      прорисовывается и заливается), плитка плавно покачивается
      в объёме, по ней проходит блик; от плитки расходятся мягкие волны, под ней тонкая полоса загрузки.
      Стили здесь: заставка видна раньше, чем загрузится JS. Убирает её src/lib/boot.ts.
    -->
    <style>
      html { background: #F4F4F2; }
      html[data-theme="dark"] { background: #0E0E10; color-scheme: dark; }
      .boot {
        --b-bg: #F4F4F2; --b-ink: #141414; --b-ink-fg: #fff; --b-fg: #141414; --b-mut: #8A8984; --b-line: rgba(20, 20, 20, .09);
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: var(--b-bg); color: var(--b-fg); font-family: "Onest", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased; transition: opacity .5s ease, visibility 0s linear .5s;
      }
      html[data-theme="dark"] .boot { --b-bg: #0E0E10; --b-ink: #ECECE8; --b-ink-fg: #141414; --b-fg: #ECECE8; --b-mut: #8E8D88; --b-line: rgba(255, 255, 255, .08); }
      .boot[data-state="done"] { opacity: 0; visibility: hidden; }
      /* сетка точек, тает к краям */
      .boot-grid { position: absolute; inset: 0; pointer-events: none;
        background-image: radial-gradient(circle, var(--b-line) 1.1px, transparent 1.4px); background-size: 26px 26px;
        -webkit-mask: radial-gradient(circle at 50% 46%, #000 0, transparent 62%); mask: radial-gradient(circle at 50% 46%, #000 0, transparent 62%);
        animation: bootFade 1.2s ease both; }
      .boot-stage { position: relative; width: 84px; height: 84px; transition: transform .5s cubic-bezier(.4, 0, .2, 1); }
      .boot[data-state="done"] .boot-stage { transform: scale(1.12); }
      /* волны: скруглённые квадраты расходятся от плитки */
      .boot-wave { position: absolute; inset: 0; border-radius: 26px; box-shadow: inset 0 0 0 1px var(--b-fg); opacity: 0; animation: bootWave 3.3s cubic-bezier(.2, .7, .3, 1) infinite; }
      .boot-wave.w2 { animation-delay: 1.1s; }
      .boot-wave.w3 { animation-delay: 2.2s; }
      .boot-tile { position: absolute; inset: 0; overflow: hidden; display: grid; place-items: center; border-radius: 26px;
        background: linear-gradient(160deg, color-mix(in srgb, var(--b-ink) 80%, var(--b-ink-fg)), var(--b-ink) 66%);
        box-shadow: 0 26px 44px -22px rgba(10, 10, 10, .6), inset 0 1px 0 rgba(255, 255, 255, .12);
        animation: bootPop .8s cubic-bezier(.3, 1.4, .5, 1) both, bootFloat 7s ease-in-out 1.7s infinite; }
      .boot-tile::after { content: ""; position: absolute; top: -40%; bottom: -40%; left: -60%; width: 40%;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .28), transparent); transform: skewX(-18deg); animation: bootShine 2.6s 1s ease-in-out infinite; }
      html[data-theme="dark"] .boot-tile::after { background: linear-gradient(100deg, transparent, rgba(0, 0, 0, .14), transparent); }
      /* деталь плитки: тонкая внутренняя рамка */
      .boot-tile::before { content: ""; position: absolute; inset: 5px; border-radius: 21px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); pointer-events: none; }
      html[data-theme="dark"] .boot-tile::before { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); }
      .boot-mark { position: relative; width: 42px; height: 41px; overflow: visible; }
      /* знак (планка и тело — разом) по кругу: прорисовывается линией → заливается → держится → снова контур и стирается */
      .bm-draw path { fill: var(--b-ink-fg); fill-opacity: 0; stroke: var(--b-ink-fg); stroke-width: 3; stroke-linejoin: round;
        stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: bootDraw 2.8s cubic-bezier(.65, 0, .35, 1) .25s infinite; }
      .boot-word { margin-top: 30px; font-size: 21px; font-weight: 500; letter-spacing: -.02em; line-height: 1.1;
        animation: bootUp .8s .25s cubic-bezier(.16, 1, .3, 1) both; }
      .boot-sub { margin-top: 6px; font-size: 13px; font-weight: 400; letter-spacing: .005em; color: var(--b-mut);
        animation: bootUp .8s .38s cubic-bezier(.16, 1, .3, 1) both; }
      /* тонкая полоса загрузки */
      .boot-bar { position: relative; overflow: hidden; width: 128px; height: 2px; margin-top: 22px; border-radius: 2px; background: var(--b-line);
        animation: bootUp .8s .5s cubic-bezier(.16, 1, .3, 1) both; }
      .boot-bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 38%; border-radius: 2px; background: var(--b-fg); animation: bootSlide 1.4s cubic-bezier(.65, 0, .35, 1) infinite; }
      .boot-hint { position: absolute; bottom: 44px; left: 16px; right: 16px; text-align: center; font-size: 12.5px; font-weight: 400; color: var(--b-mut); opacity: 0; animation: bootFade .6s 5s ease forwards; }
      @keyframes bootFade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes bootUp { from { opacity: 0; transform: translateY(10px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
      @keyframes bootPop { from { opacity: 0; transform: scale(.55) rotate(-10deg); } to { opacity: 1; transform: none; } }
      @keyframes bootWave { 0% { opacity: .22; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
      @keyframes bootShine { 0%, 55% { left: -60%; } 100% { left: 140%; } }
      @keyframes bootSlide { 0% { transform: translateX(-110%); } 100% { transform: translateX(270%); } }
      @keyframes bootDraw {
        0% { stroke-dashoffset: 1; fill-opacity: 0; stroke-width: 3; }
        30% { stroke-dashoffset: 0; fill-opacity: 0; stroke-width: 3; }
        44% { stroke-dashoffset: 0; fill-opacity: 1; stroke-width: 0; }
        80% { stroke-dashoffset: 0; fill-opacity: 1; stroke-width: 0; }
        90% { stroke-dashoffset: 0; fill-opacity: 0; stroke-width: 3; }
        100% { stroke-dashoffset: -1; fill-opacity: 0; stroke-width: 3; }
      }
      @keyframes bootFloat {
        0%, 100% { transform: perspective(520px) rotateX(0) rotateY(0); }
        25% { transform: perspective(520px) rotateX(7deg) rotateY(-9deg); }
        50% { transform: perspective(520px) rotateX(-5deg) rotateY(7deg); }
        75% { transform: perspective(520px) rotateX(5deg) rotateY(5deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bm-draw path { animation: none; fill-opacity: 1; stroke-dashoffset: 0; stroke-width: 0; }
        .boot-tile { animation: none; }
        .boot-wave, .boot-tile::after { animation: none; }
        .boot-bar i { animation-duration: 3s; }
      }
    </style>
  </head>
  <body>
    <div id="boot" class="boot" role="status" aria-live="polite" aria-label="Загрузка Jetcargo">
      <div class="boot-grid"></div>
      <div class="boot-stage">
        <span class="boot-wave"></span>
        <span class="boot-wave w2"></span>
        <span class="boot-wave w3"></span>
        <div class="boot-tile">
          <svg class="boot-mark" viewBox="0 0 94 92" aria-hidden="true">
            <g class="bm-draw"><path pathLength="1" d="M26 0H94L75 22H8Z" /><path pathLength="1" d="M61 31H74V81Q74 91 64 91H0L8 79H50Q56 79 56 73V36Z" /></g>
          </svg>
        </div>
      </div>
      <div class="boot-word">Jetcargo</div>
      <div class="boot-sub">Панель сотрудника</div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-hint">Сервер просыпается — первый запуск может занять до минуты</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
