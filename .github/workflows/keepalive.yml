# «Будильник» для бесплатного backend на Render: без запросов он засыпает через
# 15 минут, и первый запрос потом ждёт ~1 минуту. Проверка раз в 10 минут не даёт уснуть.
# Адрес задаётся переменной репозитория API_HEALTH_URL (…/health); пока её нет — ничего не делает.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_HEALTH_URL != '' }}
    steps:
      - name: Ping
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.API_HEALTH_URL }}"
