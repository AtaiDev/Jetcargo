# Непрерывная копия базы в Backblaze B2 (S3-совместимое хранилище).
# Значения подставляются из переменных окружения сервиса на Render.
dbs:
  - path: /data/app.db
    replicas:
      - type: s3
        bucket: ${B2_BUCKET}
        path: jetcargo/app.db
        endpoint: ${B2_ENDPOINT}
        access-key-id: ${B2_KEY_ID}
        secret-access-key: ${B2_APP_KEY}
        force-path-style: true
        sync-interval: 1s
        # Снимок раз в сутки, старые копии хранятся 7 дней.
        snapshot-interval: 24h
        retention: 168h
